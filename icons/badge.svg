    <linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C8890"/><stop offset=".45" stop-color="#E3E8EB"/><stop offset="1" stop-color="#7C8890"/></linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EE9F6E"/><stop offset="1" stop-color="#A9461A"/></linearGradient>
